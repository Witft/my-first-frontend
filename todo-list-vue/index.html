<!DOCTYPE html>
<html lang="zh-CN">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app" class="container">
    <h1>📝 Todo List</h1>


    <!-- 输入区域 -->
    <div class="input-area">
      <input v-model="newText" @keyup.enter="addTodo">
      <input type="date" v-model="newDate">
      <select v-model="newCategory" id="categorySelect" class="category-select">
        <option value="work">工作</option>
        <option value="life">生活</option>
        <option value="study">学习</option>
      </select>
      <button id="addBtn" @click="addTodo">添加</button>
    </div>

    <!-- 分类筛选 -->
    <div class="filter-area">
      <span class="filter-label">分类：</span>
      <button v-for="filter in ['all', 'work', 'life', 'study']"
        :class="['filter-btn', {active: categoryFilter === filter}]" @click="categoryFilter = filter">
        {{filter === 'all' ? '全部' : categoryConfig[filter].label}}
      </button>
    </div>

    <!-- 状态筛选（你删掉了，需要加回来） -->
    <div class="filter-area">
      <span class="filter-label">状态：</span>
      <button v-for="status in ['all', 'active', 'completed']"
        :class="['status-btn', {active: statusFilter === status}]" @click="statusFilter = status">
        {{status === 'all' ? '全部' : status === 'active' ? '未完成' : '已完成'}}
      </button>
    </div>

    <!-- 任务列表 -->
    <ul id="todoList" class="todo-list">
      <li v-for="todo in filteredTodos" :key="todo.id"
        :class="['todo-item', {completed: todo.completed, overdue: isOverdue(todo.dueDate) && !todo.completed}]">

        <input type="checkbox" :checked="todo.completed" @change="toggleTodo(todo.id)">
        <!-- 这里怎么处理默认值的？ -->
        <span class="todo-category" :class="todo.category">
          {{categoryConfig[todo.category].label}}
        </span>

        <span class="todo-text">
          <input v-if="editingId === todo.id" v-model="editText" class="edit-input" @blur="saveEdit(todo.id)"
            @keyup.enter="saveEdit(todo.id)" @keyup.esc="cancelEdit" autofocus>
          <span v-else @dblclick="startEdit(todo)">{{todo.text}}</span>
        </span>

        <span class="due-text">
          {{todo.dueDate || '无截止日期'}}
        </span>
        <button class="delete-btn" @click="deleteTodo(todo.id)">删除</button>
        <button @click="startEdit(todo)">编辑</button>
      </li>

      <div v-if="filteredTodos.length === 0" class="empty-state">
        <div class="empty-state-icon">🎯</div>
        <p>还没有任务，添加一个吧！</p>
      </div>
    </ul>

    <!-- 统计信息 -->
    <div class="stats">
      <span id="statsText">{{stats}}</span>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>

</html>
